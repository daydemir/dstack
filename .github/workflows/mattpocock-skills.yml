name: Update mattpocock skills

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree pull --prefix=mattpocock https://github.com/mattpocock/skills.git main --squash -m "Update mattpocock/skills subtree"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: update/mattpocock-skills
          title: Update mattpocock/skills subtree
          body: Weekly `git subtree pull` of https://github.com/mattpocock/skills.
